[package]
name = "mock-ft"
version = "1.0.0"
edition = "2021"
description = "Minimal NEP-141 used only by the local sandbox demo. Never deployed to mainnet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["legacy"] }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
