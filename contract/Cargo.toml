[package]
name = "mandate-otc"
version = "1.0.0"
edition = "2021"
description = "OTC mandate policy engine: custody + onchain limits for an AI broker"
repository = "https://github.com/amine/mandate-otc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["legacy"] }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
members = ["mock-ft"]
